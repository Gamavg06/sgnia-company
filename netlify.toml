# Configuración oficial de Netlify para SGNIA COMPANY
[build]
  publish = "."

# Rutas limpias
[[redirects]]
  from = "/fundador"
  to = "/fundador.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/panel"
  to = "/admin.html"
  status = 200

# Encabezados de seguridad y optimización de caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
